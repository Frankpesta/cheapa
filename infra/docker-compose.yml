# Cheapa infrastructure (01-foundation.md 1.3).
# Local: pnpm infra:up  (reads ../.env; ports bound to 127.0.0.1 only)
#
# App services run under the "app" profile:  pnpm infra:up:app
# Services added in later sections: worker (02), caddy (deploy).

name: cheapa

services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Read by init/01-databases.sh on first start only.
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?set USERS_DB_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U postgres -d cheapa_catalog && pg_isready -U postgres -d cheapa_users']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # BullMQ, events:price stream, rate-limit buckets. Must never evict.
  redis-queue:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_QUEUE_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
    ports:
      - '127.0.0.1:${REDIS_QUEUE_PORT:-6379}:6379'
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Search and lookup caches. Safe to lose; evicts least-recently-used keys.
  redis-cache:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - ${REDIS_CACHE_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - '127.0.0.1:${REDIS_CACHE_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # NestJS HTTP API (08-user-side.md 8.1). Talks to the other services by name.
  api:
    profiles: ['app']
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: cheapa-api:local
    restart: unless-stopped
    environment:
      &api-env # production requires the Clerk keys; set API_NODE_ENV=development in .env until they're filled in.
      NODE_ENV: ${API_NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-local}
      API_PORT: 8080
      CATALOG_DATABASE_URL: postgres://cheapa_catalog:${CATALOG_DB_PASSWORD}@postgres:5432/cheapa_catalog
      USERS_DATABASE_URL: postgres://cheapa_app:${USERS_DB_PASSWORD}@postgres:5432/cheapa_users
      REDIS_QUEUE_URL: redis://redis-queue:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on: &api-deps
      postgres: { condition: service_healthy }
      redis-queue: { condition: service_healthy }
      redis-cache: { condition: service_healthy }

  # Same image, background process: consumers, queues, scheduled jobs. No HTTP.
  api-jobs:
    profiles: ['app']
    image: cheapa-api:local
    restart: unless-stopped
    command: ['node', 'dist/main.jobs.js']
    environment: *api-env
    healthcheck: { disable: true }
    depends_on:
      <<: *api-deps
      api: { condition: service_started }

volumes:
  postgres-data:
  redis-queue-data:
