packages:
  - apps/*
  - packages/*

# One version of each shared tool across the repo. Reference with "catalog:".
catalog:
  '@eslint/js': 10.0.1
  '@fastify/multipart': 10.1.6
  '@nestjs/common': 12.3.2
  '@nestjs/core': 12.3.2
  '@nestjs/platform-fastify': 12.3.2
  '@nestjs/testing': 12.3.2
  '@swc/core': 1.16.21
  '@testcontainers/postgresql': 12.2.1
  '@types/node': 26.6.6
  '@types/pg': 8.23.1
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint-config-prettier: 10.1.8
  eslint: 10.14.0
  fastify: 5.12.7
  globals: 17.14.0
  ioredis: 6.0.0
  nestjs-pino: 5.3.1
  pg: 8.23.1
  pino-http: 11.0.0
  pino-pretty: 13.2.0
  pino: 10.4.0
  prettier: 3.9.10
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  testcontainers: 12.2.1
  tsx: 4.23.15
  turbo: 2.11.10
  typescript-eslint: 8.72.1
  # typescript-eslint 8.x supports TypeScript < 6.1; move to 7.x when it does (see BACKLOG.md).
  typescript: 6.0.3
  unplugin-swc: 2.0.0
  vitest: 5.0.5
  zod: 4.6.7

engineStrict: true

minimumReleaseAgeExclude:
  - globals@17.14.0

# Dependency install scripts, reviewed one by one (pnpm blocks unreviewed ones).
allowBuilds:
  esbuild: true # verifies its platform binary; harmless
  '@swc/core': true # verifies its platform binary (tests compile decorators with swc)
  cpu-features: false # optional native addon (ssh2 via testcontainers); not needed
  ssh2: false # optional native crypto; pure-JS fallback is fine for tests
  protobufjs: false # postinstall only prints a notice
