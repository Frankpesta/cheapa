<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Searching stores</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A7A3A;text-decoration:none}a:hover{color:#075E2C}
.disp{font-family:'Bricolage Grotesque',sans-serif}
.mono{font-family:'Geist Mono',monospace}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.st{display:flex;align-items:center;gap:12px;height:44px;border-bottom:1px dashed #D5DACF;font-size:15px}
.ok{width:24px;height:24px;border-radius:50%;background:#0E1A13;color:#C6F432;display:flex;align-items:center;justify-content:center}
.wait{width:24px;height:24px;border-radius:50%;border:2px solid #D5DACF;box-sizing:border-box}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid #E3E6DD;border-top-color:#0A7A3A;box-sizing:border-box;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes scan{0%{top:8px}50%{top:180px}100%{top:8px}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.scanline{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5EF; color: #0E1A13; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; padding: 58px 24px 36px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Home.dc.html" aria-label="Cancel search" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #0E1A13">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </a>
    <span class="mono" style="font-size: 12px; color: #55615A">FROM SHARE · 1 IMAGE</span>
  </div>

  <div style="display: flex; gap: 16px; align-items: flex-end; margin-top: 12px">
    <div style="width: 132px; height: 196px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E6DD; box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; flex-shrink: 0">
      <div style="display: flex; align-items: center; gap: 6px">
        <div style="width: 18px; height: 18px; border-radius: 50%; background: #F2D7C5"></div>
        <div style="height: 5px; width: 50px; border-radius: 3px; background: #E3E6DD"></div>
      </div>
      <div style="flex-grow: 1; border-radius: 12px; background: #EDEFE7; display: flex; align-items: center; justify-content: center">
        <div style="width: 36px; height: 66px; border-radius: 9px; border: 2.5px solid #0E1A13; position: relative; background: #FFFFFF">
          <div style="position: absolute; top: 5px; left: 5px; width: 12px; height: 12px; border-radius: 4px; border: 2px solid #0E1A13"></div>
        </div>
      </div>
      <div class="scanline" style="position: absolute; left: 0; right: 0; height: 3px; background: #C6F432; box-shadow: 0 0 14px #C6F432; animation: scan 2.4s ease-in-out infinite; top: 8px"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 6px">
      <span class="mono" style="font-size: 11px; letter-spacing: 1px; color: #55615A">WE SEE</span>
      <span class="disp" style="font-size: 26px; line-height: 1.05; font-weight: 800; letter-spacing: -0.5px">Tecno Camon 30</span>
      <span style="font-size: 14px; color: #3A463F">Phone · 8GB / 256GB · black</span>
      <span style="align-self: flex-start; font-size: 12px; font-weight: 600; background: #E7F5C2; color: #2F4A06; padding: 4px 8px; border-radius: 6px">High match confidence</span>
    </div>
  </div>

  <div style="margin-top: 30px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px">
      <h1 class="disp" style="margin: 0; font-size: 22px; font-weight: 800">Checking 14 stores</h1>
      <span class="mono" style="font-size: 13px; color: #0A7A3A">9 / 14</span>
    </div>
    <div style="height: 8px; border-radius: 4px; background: #E3E6DD; overflow: hidden; margin-bottom: 8px">
      <div style="width: 64%; height: 100%; border-radius: 4px; background: #0E1A13"></div>
    </div>
    <div class="st"><div class="ok"><svg class="ic" viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke-width: 3" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></div><span style="flex-grow: 1">Jumia</span><span class="mono" style="font-size: 12px; color: #55615A">4 listings</span></div>
    <div class="st"><div class="ok"><svg class="ic" viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke-width: 3" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></div><span style="flex-grow: 1">Konga</span><span class="mono" style="font-size: 12px; color: #55615A">2 listings</span></div>
    <div class="st"><div class="ok"><svg class="ic" viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke-width: 3" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></div><span style="flex-grow: 1">Slot</span><span class="mono" style="font-size: 12px; color: #55615A">1 listing</span></div>
    <div class="st"><div class="spin" role="img" aria-label="Checking"></div><span style="flex-grow: 1">Jiji</span><span class="mono" style="font-size: 12px; color: #55615A">checking…</span></div>
    <div class="st"><div class="wait"></div><span style="flex-grow: 1; color: #55615A">Pointek, 3CHUB and 8 more</span></div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="background: #0E1A13; color: #F4F5EF; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <span class="mono" style="font-size: 11px; color: #C6F432">SO FAR</span>
    <span style="flex-grow: 1; font-size: 14px">Cheapest new</span>
    <span class="disp" style="font-size: 20px; font-weight: 800; color: #C6F432">₦318,500</span>
  </div>
  <a href="Results.dc.html" style="margin-top: 12px; height: 54px; border-radius: 16px; border: 1.5px solid #0E1A13; color: #0E1A13; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">See results now</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
